apiVersion: 1

prune: true

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 5s
      exemplarTraceIdDestinations:
        - datasourceUid: tempo
          name: trace_id

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: TraceID
          datasourceUid: tempo
          matcherRegex: '"trace_id":\s*"([0-9a-f]{32})"'
          url: '$${__value.raw}'
          urlDisplayLabel: Открыть трейс
        - name: TaskID
          matcherRegex: '"task_id":\s*"([^" ]+)"'
          url: '/d/rentlens-pipeline/rentlens?var-task_id=$${__value.raw}'
          urlDisplayLabel: История задачи

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        tags:
          - key: service.name
            value: service
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '{service=~"rentlens-.+"} | json | trace_id="$${__trace.traceId}"'
