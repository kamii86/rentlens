services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rentlens
      POSTGRES_USER: rentlens
      POSTGRES_PASSWORD: rentlens
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentlens -d rentlens"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://rentlens:rentlens@db:5432/rentlens
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: