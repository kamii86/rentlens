[project]
name = "rentlens"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kamii86", email = "camilnu12345@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
rentlens = "rentlens:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rentlens"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]
web = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "sqlalchemy[asyncio]>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
